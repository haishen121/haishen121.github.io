name: Sync FreeNodes

on:
  schedule:
    # 每天 06:00 / 12:00 / 18:00 (UTC) 执行一次
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # GitHub Pages 部署所需
  pages: write
  id-token: write

concurrency:
  group: sync-freenodes
  cancel-in-progress: false

env:
  SRC_REPO: https://github.com/Barabama/FreeNodes.git
  SRC_BRANCH: feat/ai-crawler-v2
  SRC_SUBDIR: nodes
  DST_SUBDIR: nodes

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 拉取源仓库 (sparse checkout)
        run: |
          set -euo pipefail
          rm -rf .freenodes-src
          git clone \
            --filter=blob:none \
            --no-tags \
            --single-branch \
            --branch "${SRC_BRANCH}" \
            --sparse \
            "${SRC_REPO}" .freenodes-src
          git -C .freenodes-src sparse-checkout set "${SRC_SUBDIR}"
          git -C .freenodes-src rev-parse --short HEAD

      - name: 拷贝文件到本地 ${DST_SUBDIR} 目录
        run: |
          set -euo pipefail
          mkdir -p "${DST_SUBDIR}"
          if [ -d ".freenodes-src/${SRC_SUBDIR}" ]; then
            cp -a ".freenodes-src/${SRC_SUBDIR}/." "${DST_SUBDIR}/"
          else
            echo "::error::源仓库 ${SRC_REPO} 的 ${SRC_BRANCH} 分支下不存在 ${SRC_SUBDIR} 目录"
            exit 1
          fi
          echo "文件总数: $(find "${DST_SUBDIR}" -type f ! -name 'index.md' | wc -l)"

      - name: 生成 index.html
        run: |
          set -euo pipefail
          # index.html 只生成到站点目录，不写入 ${DST_SUBDIR}，因此不会入库
          mkdir -p _site
          export SRC_DIR=".freenodes-src"
          export DST_DIR="${DST_SUBDIR}"
          export OUT="_site/index.html"

          python3 - <<'PY'
          import html
          import os
          import subprocess
          import urllib.parse
          from datetime import datetime, timezone

          src_dir = os.environ["SRC_DIR"]
          src_sub = os.environ["SRC_SUBDIR"].strip("/")
          dst_dir = os.environ["DST_DIR"]
          out_path = os.environ["OUT"]
          repo = os.environ["SRC_REPO"]
          branch = os.environ["SRC_BRANCH"]

          def list_files():
              found = []
              for dirpath, _dirs, filenames in os.walk(dst_dir):
                  for name in filenames:
                      rel = os.path.relpath(os.path.join(dirpath, name), dst_dir)
                      rel = rel.replace(os.sep, "/")
                      if rel == "index.html":
                          continue
                      found.append(rel)
              return sorted(found)

          def updated_at(rel):
              # 优先使用源仓库中该文件最后一次提交的时间
              try:
                  res = subprocess.run(
                      ["git", "-C", src_dir, "log", "-1", "--format=%cI", "--", src_sub + "/" + rel],
                      capture_output=True,
                      text=True,
                      check=True,
                  )
                  value = res.stdout.strip()
                  if value:
                      return value
              except Exception:
                  pass
              try:
                  ts = os.path.getmtime(os.path.join(dst_dir, rel))
                  return datetime.fromtimestamp(ts, timezone.utc).strftime("%Y-%m-%dT%H:%M:%S+0000")
              except Exception:
                  return "-"

          def source_commit():
              try:
                  res = subprocess.run(
                      ["git", "-C", src_dir, "rev-parse", "HEAD"],
                      capture_output=True,
                      text=True,
                      check=True,
                  )
                  return res.stdout.strip()
              except Exception:
                  return "-"

          css = (
              'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;'
              "max-width:960px;margin:2rem auto;padding:0 1rem;line-height:1.6;color:#24292f}"
              "h1{border-bottom:1px solid #d0d7de;padding-bottom:.3em}"
              "table{border-collapse:collapse;width:100%}"
              "th,td{border:1px solid #d0d7de;padding:6px 13px;text-align:left}"
              "tr:nth-child(2n){background:#f6f8fa}"
              "code{background:#f6f8fa;padding:.2em .4em;border-radius:6px;font-size:85%}"
              "a{color:#0969da;text-decoration:none}a:hover{text-decoration:underline}"
          )

          files = list_files()
          rows = []
          for rel in files:
              href = urllib.parse.quote(rel)
              label = html.escape(os.path.basename(rel))
              rows.append(
                  '<tr><td><a href="' + href + '">' + label + "</a></td><td>"
                  + html.escape(updated_at(rel)) + "</td></tr>"
              )
          generated = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          doc = (
              "<!DOCTYPE html>\n"
              '<html lang="zh-CN">\n'
              "<head>\n"
              '<meta charset="utf-8">\n'
              '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
              "<title>Nodes 索引</title>\n"
              "<style>" + css + "</style>\n"
              "</head>\n"
              "<body>\n"
              "<h1>Nodes 索引</h1>\n"
              "<p>数据源: <code>" + html.escape(repo) + "</code><br>"
              "分支: <code>" + html.escape(branch) + "</code><br>"
              "源目录: <code>" + html.escape(src_sub) + "/</code><br>"
              "源提交: <code>" + html.escape(source_commit()) + "</code><br>"
              "生成时间: " + generated + "</p>\n"
              "<table>\n"
              "<thead><tr><th>文件名</th><th>更新时间</th></tr></thead>\n"
              "<tbody>\n"
              + "\n".join(rows) + "\n"
              "</tbody>\n"
              "</table>\n"
              "<p>共 " + str(len(files)) + " 个文件。</p>\n"
              "</body>\n"
              "</html>\n"
          )

          os.makedirs(os.path.dirname(out_path) or ".", exist_ok=True)
          with open(out_path, "w", encoding="utf-8") as fp:
              fp.write(doc)

          print("index.html 已生成，共 %d 个文件" % len(files))
          PY
   
      - name: 提交并推送
        env:
          # 推送到触发器所在的分支；workflow_dispatch 时取当前分支，schedule 时取默认分支
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf .freenodes-src

          # 定时任务在默认分支的 ref 上运行，gh-pages 等特殊 ref 下不做推送
          if [ -z "${TARGET_BRANCH}" ] || [ "${TARGET_BRANCH}" = "gh-pages" ]; then
            echo "::notice::当前 ref 为 '${TARGET_BRANCH}'，跳过提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A "${DST_SUBDIR}"
          if git diff --cached --quiet; then
            echo "没有变化需要提交"
            exit 0
          fi

          git commit -m "chore(nodes): sync from ${SRC_REPO}@${SRC_BRANCH} ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          git push origin "HEAD:${TARGET_BRANCH}"
          echo "推送成功 -> ${TARGET_BRANCH}"
                 
      - name: 配置 Pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/configure-pages@v5

      - name: 构建静态站点
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          mkdir -p _site
          # _site/index.html 已由上一步生成，这里拷贝 nodes 内容时排除同名文件，避免覆盖索引页
          rsync -a --exclude '/index.html' "${DST_SUBDIR}/" _site/
          # 禁用 Jekyll，避免忽略下划线开头的文件
          touch _site/.nojekyll

          echo "站点文件数: $(find _site -type f | wc -l)"

      - name: 上传 Pages 产物
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deployment
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/deploy-pages@v4
